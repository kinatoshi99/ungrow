name: apply PLOY staging patch

on:
  push:
    branches:
      - feat/ploy-staging

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'staging: apply PLOY feature') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ploy-staging
          fetch-depth: 0
      - name: Apply verified transform
        run: python3 scripts/apply-ploy-staging.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check characters.js
          node --check plant-svg.js
          node --check ploy-svg.js
      - name: Remove one-shot staging helpers
        run: |
          rm -f scripts/apply-ploy-staging.py
          rm -f .github/workflows/apply-ploy-staging.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit transformed tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "staging: apply PLOY feature"
          git push origin HEAD:feat/ploy-staging
